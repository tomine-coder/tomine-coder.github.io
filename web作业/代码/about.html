<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我 - 王浩杰</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #666;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e8e8e8;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-sm: 12px;
            --gradient-bg: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        /* 深色模式变量 */
        [data-theme="dark"] {
            --primary-color: #f0f0f0;
            --secondary-color: #a0a0a0;
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --border-color: #2d3561;
            --shadow: 0 2px 12px rgba(0,0,0,0.3);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.4);
            --gradient-bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        body {
            background: var(--gradient-bg);
            background-attachment: fixed;
            color: var(--primary-color);
            line-height: 1.7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            transition: background 0.5s ease, color 0.3s ease;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        /* 返回按钮 */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--card-bg);
            color: var(--primary-color);
            text-decoration: none;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 40px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
            transform: translateX(-4px);
        }

        /* 页面标题 */
        .page-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 50px;
            letter-spacing: -0.5px;
        }

        /* 模块卡片 */
        .module-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .module-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .module-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .module-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .module-title h2 {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        /* 个人信息 */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .info-item {
            background: var(--bg-color);
            padding: 20px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .info-item i {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .info-content h4 {
            color: var(--secondary-color);
            font-size: 0.85rem;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .info-content p {
            color: var(--primary-color);
            font-size: 1rem;
            font-weight: 600;
        }

        /* 联系方式 */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .contact-item {
            background: var(--bg-color);
            padding: 24px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .contact-item:hover {
            border-color: #667eea;
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .contact-item i {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            margin: 0 auto 14px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .contact-item h4 {
            color: var(--primary-color);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .contact-item p {
            color: var(--secondary-color);
            font-size: 0.9rem;
        }

        /* 深色模式切换按钮 */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--primary-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: var(--shadow-hover);
        }

        .theme-toggle i {
            transition: transform 0.3s ease;
        }

        [data-theme="dark"] .theme-toggle i {
            transform: rotate(180deg);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 返回按钮 -->
        <a href="个人主页-架构.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> 返回主页
        </a>

        <!-- 页面标题 -->
        <h1 class="page-title">关于我</h1>

        <!-- 模块一：个人信息 -->
        <section class="module-card">
            <div class="module-header">
                <div class="module-icon">
                    <i class="fas fa-id-card"></i>
                </div>
                <div class="module-title">

            <div class="info-grid">
                <div class="info-item">
                    <i class="fas fa-user"></i>
                    <div class="info-content">
                        <h4>姓名</h4>
                        <p>王浩杰</p>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fas fa-graduation-cap"></i>
                    <div class="info-content">
                        <h4>学历</h4>
                        <p>本科在读</p>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fas fa-briefcase"></i>
                    <div class="info-content">
                        <h4>专业</h4>
                        <p>人工智能</p>
                    </div>
                </div>
                <div class="info-item">

                        <h4>现居地</h4>
                        <p>河北保定</p>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fas fa-home"></i>
                    <div class="info-content">
                        <h4>家乡</h4>
                        <p>天津</p>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fas fa-birthday-cake"></i>
                    <div class="info-content">
                        <h4>出生年月</h4>
                        <p>2005年6月1日</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 模块二：联系方式 -->
        <section class="module-card">
            <div class="module-header">
                <div class="module-icon">
                    <i class="fas fa-address-book"></i>
                </div>
                <div class="module-title">
                    <h2>联系方式</h2>

            </div>
            <div class="contact-grid">
                <div class="contact-item">
                    <i class="fas fa-envelope"></i>
                    <h4>电子邮箱</h4>
                    <p>2593165140@qq.com</p>
                </div>
                <div class="contact-item">
                    <i class="fas fa-phone"></i>
                    <h4>手机号码</h4>
                    <p>135****2110</p>
                </div>
                <div class="contact-item">
                    <i class="fab fa-weixin"></i>
                    <h4>微信</h4>
                    <p>whj09726</p>
                </div>
            </div>
        </section>

        <!-- 深色模式切换按钮 -->
        <button class="theme-toggle" onclick="toggleTheme()" title="切换深色/浅色模式">
            <i class="fas fa-moon"></i>
        </button>

    </div>

    <script src="theme.js"></script>
</body>
</html>
