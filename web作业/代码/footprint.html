<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的足迹 - 王浩杰</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #666;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e8e8e8;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-sm: 12px;
            --gradient-bg: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        /* 深色模式变量 */
        [data-theme="dark"] {
            --primary-color: #f0f0f0;
            --secondary-color: #a0a0a0;
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --border-color: #2d3561;
            --shadow: 0 2px 12px rgba(0,0,0,0.3);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.4);
            --gradient-bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        body {
            background: var(--gradient-bg);
            background-attachment: fixed;
            color: var(--primary-color);
            line-height: 1.7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            transition: background 0.5s ease, color 0.3s ease;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        /* 返回按钮 */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--card-bg);
            color: var(--primary-color);
            text-decoration: none;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 40px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
            transform: translateX(-4px);
        }

        /* 页面标题 */
        .page-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 50px;
            letter-spacing: -0.5px;
        }

        /* 城市卡片 */
        .city-section {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .city-section:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .city-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .city-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .city-title h2 {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .city-title .tag {
            color: var(--secondary-color);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .city-content p {
            color: var(--secondary-color);
            line-height: 1.8;
            margin-bottom: 16px;
            font-size: 1.05rem;
        }

        /* 城市图片 */
        .city-image {
            width: 100%;
            height: 220px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .city-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .city-image:hover img {
            transform: scale(1.03);
        }

        /* 点击提示 */
        .click-tip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 14px 28px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--primary-color);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .click-tip:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        /* 深色模式切换按钮 */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--primary-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: var(--shadow-hover);
        }

        .theme-toggle i {
            transition: transform 0.3s ease;
        }

        [data-theme="dark"] .theme-toggle i {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 返回按钮 -->
        <a href="个人主页-架构.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> 返回主页
        </a>

        <!-- 页面标题 -->
        <h1 class="page-title">我的足迹</h1>

        <!-- 天津 -->
        <section class="city-section">
            <div class="city-header">
                <div class="city-icon">
                    <i class="fas fa-home"></i>
                </div>
                <div class="city-title">
                    <h2>天津</h2>
                    <span class="tag">家乡</span>
                </div>
            </div>
            <div class="city-content">
                <div class="city-image">
                    <img src="../图片/tj.png" alt="天津海河夜景">
                </div>
                <p>九河下梢天津卫，三道浮桥两道关。天津是我成长的地方，一座有着600多年历史的港口城市。</p>
                <a href="tianjin.html" class="click-tip">
                    <i class="fas fa-hand-pointer"></i> 点击了解天津详情
                </a>
            </div>
        </section>

        <!-- 保定 -->
        <section class="city-section">
            <div class="city-header">
                <div class="city-icon">
                    <i class="fas fa-map-pin"></i>
                </div>
                <div class="city-title">
                    <h2>保定</h2>
                    <span class="tag">现居</span>
                </div>
            </div>
            <div class="city-content">
                <div class="city-image">
                    <img src="../图片/bd.png" alt="保定古城">
                </div>
                <p>北控三关，南达九省，畿辅重地，都南屏翰。保定是一座有着3000多年历史的古城。</p>
                <a href="baoding.html" class="click-tip">
                    <i class="fas fa-hand-pointer"></i> 点击了解保定详情
                </a>
            </div>
        </section>

        <!-- 深色模式切换按钮 -->
        <button class="theme-toggle" onclick="toggleTheme()" title="切换深色/浅色模式">
            <i class="fas fa-moon"></i>
        </button>

    </div>

    <script src="theme.js"></script>
</body>
</html>
